const shuffle = arr => {
const a = […arr];
for (let i = a.length-1; i > 0; i–) {
const j = Math.floor(Math.random()*(i+1));
[a[i],a[j]] = [a[j],a[i]];
}
return a;
};

const [particles, setParticles] = useState([]);
const timerRef = useRef(null);

const currentUnits = subject === “science” ? SCIENCE_UNITS : SOCIAL_UNITS;

const spawnParticles = ok => {
setParticles(Array.from({length:8},(_,i)=>({
id: Date.now()+i,
x: 20+Math.random()*60,
y: 30+Math.random()*40,
emoji: ok ? [“⭐”,“✨”,“🎉”,“💫”][i%4] : [“💨”,“😅”][i%2]
})));
clearTimeout(timerRef.current);
timerRef.current = setTimeout(()=>setParticles([]), 1100);
};

const buildChoices = (cards, currentIdx, subj) => {
const card = cards[currentIdx];
// 元素記号は固定選択肢を使う
if (card.choices) {
return shuffle(card.choices.map(ch => ({ word:ch, isSymbol:true })));
}
// 同じtypeから選ぶ、足りなければ補充
const pool = (subj === “science” ? SCIENCE_UNITS : SOCIAL_UNITS).flatMap(u=>u.cards);
const same = shuffle(pool.filter(c => c.word !== card.word && c.type === card.type));
const other = shuffle(pool.filter(c => c.word !== card.word && c.type !== card.type));
const others = […same, …other].slice(0,3);
return shuffle([card, …others]);
};

const startStudy = (u, m) => {
const shuffled = shuffle(u.cards);
setUnit(u); setMode(m); setDeck(shuffled); setIdx(0);
setFlipped(false); setSelected(null); setScore({ok:0,ng:0});
if (m===“quiz”) setQuizChoices(buildChoices(shuffled, 0, subject));
setScreen(“study”);
};

const goNext = () => {
const next = idx+1;
if (next >= deck.length) { setScreen(“result”); return; }
setIdx(next); setFlipped(false); setSelected(null);
if (mode===“quiz”) setQuizChoices(buildChoices(deck, next, subject));
};

const handleChoice = choice => {
if (selected !== null) return;
setSelected(choice);
const card = deck[idx];
const correctWord = card.answer || card.word;
const choiceWord = choice.isSymbol ? choice.word : choice.word;
const ok = choiceWord === correctWord;
setScore(s=>({ ok: s.ok+(ok?1:0), ng: s.ng+(ok?0:1) }));
spawnParticles(ok);
};

const unitColor = unit ? unit.color : “#6478ff”;
const totalCards = deck.length;

return (

))}

              <div style={{fontSize:"0.68rem",color:"#445",marginBottom:6}}>次の説明にあてはまる語句はどれ？</div>
              <p style={{margin:0,fontSize:"0.9rem",lineHeight:1.8,color:"#c8cce0"}}>{deck[idx].desc}</p>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
              {quizChoices.map((c,i)=>{
                const answered = selected !== null;
                const correctWord = deck[idx].answer || deck[idx].word;
                const isRight = c.word === correctWord;
                const isSel = selected !== null && selected.word === c.word;
                let bg="rgba(18,20,44,0.85)", border="1px solid #252545", color="#ccd";
                if (answered) {
                  if (isRight) { bg="rgba(39,174,96,0.18)"; border="1px solid #27ae6077"; color="#7ef0a8"; }
                  else if (isSel) { bg="rgba(192,57,43,0.18)"; border="1px solid #c0392b77"; color="#f08080"; }
                }
                return (
                  <div key={i} className={answered?"":"cb"} onClick={()=>handleChoice(c)}
                    style={{background:bg,border,borderRadius:11,padding:"12px 14px",color,display:"flex",alignItems:"center",gap:10,fontSize:"0.92rem",opacity:answered&&!isRight&&!isSel?0.38:1}}>
                    <span style={{width:26,height:26,borderRadius:7,flexShrink:0,background:answered?(isRight?"#27ae60":isSel?"#c0392b":"#1a1a35"):"#1a1a35",border:answered?"none":"1px solid #334",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"0.76rem",fontWeight:700,color:answered?"#fff":"#556"}}>
                      {answered?(isRight?"○":isSel?"✕":""):["A","B","C","D"][i]}
                    </span>
                    {c.word}
                  </div>
                );
              })}
            </div>
            {selected !== null && (
              <div>
                <div style={{background:selected.word===(deck[idx].answer||deck[idx].word)?"rgba(39,174,96,0.11)":"rgba(192,57,43,0.11)",border:`1px solid ${selected.word===(deck[idx].answer||deck[idx].word)?"#27ae60":"#c0392b"}55`,borderRadius:12,padding:"12px 15px",marginBottom:11,animation:"fadeIn 0.25s ease"}}>
                  <div style={{fontWeight:700,fontSize:"1.01rem",marginBottom:5,color:selected.word===(deck[idx].answer||deck[idx].word)?"#7ef0a8":"#f08080"}}>
                    {selected.word===(deck[idx].answer||deck[idx].word) ? "🎉 正解！" : `😅 不正解… 正解は「${deck[idx].answer||deck[idx].word}」`}
                  </div>
                </div>
                <button className="fb" onClick={goNext} style={{width:"100%",padding:"13px",borderRadius:12,background:`linear-gradient(135deg,${unitColor},${unitColor}bb)`,border:"none",color:"#fff",fontWeight:700,fontSize:"0.95rem",animation:"pulse 2s infinite"}}>
                  {idx+1>=totalCards?"結果を見る 🏆":"次へ →"}
                </button>
              </div>
            )}
          </div>
        )}
      </div>
    )}

    {/* ── RESULT ── */}
    {screen==="result" && (
      <div style={{animation:"fadeIn 0.4s ease",textAlign:"center",paddingTop:20}}>
        <div style={{fontSize:"3.5rem",marginBottom:10}}>{score.ok/totalCards>=0.8?"🏆":score.ok/totalCards>=0.5?"👍":"📚"}</div>
        <h2 style={{fontSize:"1.3rem",fontWeight:900,marginBottom:5,color:unitColor}}>{unit.label} 完了！</h2>
        {mode==="quiz" ? (
          <div>
            <p style={{fontSize:"1.9rem",fontWeight:900,marginBottom:4}}>{score.ok} <span style={{fontSize:"0.95rem",color:"#778"}}>/ {totalCards} 問正解</span></p>
            <p style={{color:"#aab",fontSize:"0.85rem",marginBottom:22}}>正解率 {Math.round((score.ok/totalCards)*100)}%　{score.ok/totalCards>=0.8?"すばらしい！🎉":score.ok/totalCards>=0.5?"なかなか👍":"もう一度復習しよう📖"}</p>
          </div>
        ) : (
          <div>
            <p style={{fontSize:"1.4rem",fontWeight:700,marginBottom:4}}>✅ {score.ok}語 / ❌ {score.ng}語</p>
            <p style={{color:"#aab",fontSize:"0.85rem",marginBottom:22}}>全{totalCards}語句を確認しました！</p>
          </div>
        )}
        <div style={{display:"flex",gap:9,justifyContent:"center",flexWrap:"wrap"}}>
          <button className="fb" onClick={()=>startStudy(unit,mode)} style={{padding:"11px 18px",borderRadius:11,background:`linear-gradient(135deg,${unitColor},${unitColor}99)`,border:"none",color:"#fff",fontWeight:700,fontSize:"0.88rem"}}>もう一度</button>
          <button className="fb" onClick={()=>startStudy(unit,mode==="flashcard"?"quiz":"flashcard")} style={{padding:"11px 18px",borderRadius:11,background:"rgba(100,120,255,0.18)",border:"1px solid rgba(100,120,255,0.35)",color:"#aab",fontWeight:700,fontSize:"0.88rem"}}>{mode==="flashcard"?"🧠 クイズに挑戦":"📖 カードで復習"}</button>
          <button className="fb" onClick={()=>setScreen("units")} style={{padding:"11px 18px",borderRadius:11,background:"rgba(50,50,70,0.5)",border:"1px solid #334",color:"#778",fontWeight:700,fontSize:"0.88rem"}}>← 単元選択</button>
        </div>
      </div>
    )}

  </div>
</div>
```

);
}

ReactDOM.createRoot(document.getElementById(“root”)).render(<App />);
</script>
